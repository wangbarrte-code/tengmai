function render(filter){
  var list = document.getElementById('products');
  var data = filter && filter!=='all' ? PRODUCTS.filter(function(p){return p.c===filter;}) : PRODUCTS;
  var t = I18N[lang];
  list.innerHTML = data.map(function(p){
    var name = p[lang] || p.en;
    var zhName = p.zh;
    var waText = encodeURIComponent('Hi TENGMAI! I want price for '+p.en);
    return '<div class="p-item" onclick="location.href=\''+p.slug+'.html\'">'+
      '<img src="'+p.img+'" alt="'+p.en+'" loading="lazy">'+
      '<div class="body"><h3><a href="'+p.slug+'.html" onclick="event.stopPropagation()">'+name+'</a></h3><div class="zh-name">'+zhName+'</div><div class="en">'+p.en+'</div>'+
      '<div class="actions"><a href="https://wa.me/8613953743003?text='+waText+'" class="wa" onclick="event.stopPropagation()"><i class="fab fa-whatsapp"></i> '+t.ask+'</a></div></div></div>';
  }).join('');
}

function setLang(l){ lang=l; localStorage.setItem('tengmai_lang',l); applyLang(); render(document.querySelector('.cat-tab.active').dataset.filter); }
function applyLang(){
  var t=I18N[lang];
  document.querySelectorAll('[data-i18n]').forEach(function(el){ var k=el.getAttribute('data-i18n'); if(t[k]) el.textContent=t[k]; });
  document.documentElement.lang=lang;
  if(lang==='ar'){document.body.style.direction='rtl';}else{document.body.style.direction='ltr';}
  document.getElementById('btn-en').classList.toggle('active',lang==='en');
  document.getElementById('btn-zh').classList.toggle('active',lang==='zh');
  document.getElementById('btn-ar').classList.toggle('active',lang==='ar');
}
document.querySelectorAll('.cat-tab').forEach(function(btn){
  btn.addEventListener('click',function(){
    document.querySelectorAll('.cat-tab').forEach(function(b){b.classList.remove('active');});
    btn.classList.add('active');
    render(btn.dataset.filter);
  });
});
applyLang();
