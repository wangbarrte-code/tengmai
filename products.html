.cat-tab:hover{border-color:var(--gold);color:var(--gold);}
.cat-tab.active{background:var(--dark2);border-color:var(--dark2);color:#fff;}

.products{max-width:1200px;margin:0 auto;padding:0 24px 60px;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:20px;}
.p-item{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 3px 14px rgba(0,0,0,.07);transition:.3s;cursor:pointer;}
.p-item:hover{transform:translateY(-5px);box-shadow:0 10px 30px rgba(0,0,0,.13);}
.p-item img{width:100%;height:170px;object-fit:cover;background:#eee;}
.p-item .body{padding:14px;}
.p-item h3{font-size:15px;margin-bottom:4px;}
.p-item .en{font-size:11px;color:#999;}
.p-item .actions{display:flex;gap:8px;margin-top:10px;}
.p-item .wa{flex:1;background:#25d366;color:#fff;text-decoration:none;text-align:center;padding:8px;border-radius:18px;font-size:11px;font-weight:700;}
.p-item .wa:hover{opacity:.9;}

.footer{text-align:center;padding:30px;color:#999;font-size:12px;background:var(--dark);color:rgba(255,255,255,.7);}
.footer a{color:var(--gold-light);text-decoration:none;}

#lb{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.94);z-index:999;align-items:center;justify-content:center;}
#lb img{max-width:90vw;max-height:80vh;border-radius:10px;}

@media(max-width:768px){
  .hamburger{display:block;}
  .nav-links{display:none;position:absolute;top:100%;left:0;right:0;background:rgba(15,15,26,.98);flex-direction:column;padding:18px 24px;align-items:flex-start;}
  .nav-links.open{display:flex;}

var I18N = {

};

function render(filter){
  var list = document.getElementById('products');
  var data = filter && filter!=='all' ? PRODUCTS.filter(function(p){return p.c===filter;}) : PRODUCTS;
  var t = I18N[lang];
  list.innerHTML = data.map(function(p){
    var name = p[lang] || p.en;
    var waText = encodeURIComponent('Hi TENGMAI! I want price for '+p.en);
    var note = (p.c==='pandora' && t.pandora_note) ? '<div class="pandora-note">'+t.pandora_note+'</div>' : '';
    return '<div class="p-item" onclick="openImg(\''+p.img+'\')">'+
      '<img src="'+p.img+'" alt="'+p.en+'" loading="lazy">'+
      '<div class="body"><h3>'+name+'</h3><div class="en">'+p.en+'</div>'+note+

  }).join('');
}
function openImg(src){ document.getElementById('lbImg').src=src; document.getElementById('lb').style.display='flex'; }
function toggleMenu(){ document.getElementById('navLinks').classList.toggle('open'); }
function setLang(l){ lang=l; localStorage.setItem('tengmai_lang',l); applyLang(); render(document.querySelector('.cat-tab.active').dataset.filter); }
function applyLang(){
  var t=I18N[lang];
  document.querySelectorAll('[data-i18n]').forEach(function(el){ var k=el.getAttribute('data-i18n'); if(t[k]) el.textContent=t[k]; });
  document.documentElement.lang=lang;
  if(lang==='ar'){document.body.style.direction='rtl';}else{document.body.style.direction='ltr';}
  document.getElementById('btn-en').classList.toggle('active',lang==='en');
  document.getElementById('btn-zh').classList.toggle('active',lang==='zh');
  document.getElementById('btn-ar').classList.toggle('active',lang==='ar');
}
document.querySelectorAll('.cat-tab').forEach(function(btn){
  btn.addEventListener('click',function(){
    document.querySelectorAll('.cat-tab').forEach(function(b){b.classList.remove('active');});
    btn.classList.add('active');
    render(btn.dataset.filter);
  });
});
applyLang();
