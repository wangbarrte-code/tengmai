var CAT = {"dining-table": {"id": "dining-table", "en": "Dining Tables", "zh": "餐桌"}, "coffee-table": {"id": "coffee-table", "en": "Coffee Tables", "zh": "茶几"}, "console-table": {"id": "console-table", "en": "Console Tables", "zh": "玄关/边几"}, "hardware": {"id": "hardware", "en": "Hardware", "zh": "五金配件"}, "stone-slab": {"id": "stone-slab", "en": "Stone Slabs", "zh": "桌面石材"}};
function render(filter){
  var list = document.getElementById('products');
  var data = filter && filter!=='all' ? PRODUCTS.filter(function(p){return p.c===filter;}) : PRODUCTS;
  var t = I18N[lang];
  list.innerHTML = data.map(function(p){
    var name = p[lang] || p.en;
    var desc = (lang==='zh'&&p.desc_zh) ? p.desc_zh : p.desc_en;
    var catName = CAT[p.c] ? (lang==='zh'?CAT[p.c].zh:CAT[p.c].en) : '';
    var waText = encodeURIComponent('Hi TENGMAI! I am interested in '+p.en);
    return '<div class="p-item" onclick="location.href=\''+p.slug+'.html\'">'+
      '<img src="'+p.img+'" alt="'+p.en+'" loading="lazy">'+
      '<div class="body"><div class="cat">'+catName+'</div>'+
      '<h3><a href="'+p.slug+'.html" onclick="event.stopPropagation()">'+name+'</a></h3>'+
      '<div class="zh-name">'+p.zh+'</div>'+
      '<div class="desc">'+desc+'</div>'+
      '<div class="actions"><a href="https://wa.me/8613953743003?text='+waText+'" class="wa" onclick="event.stopPropagation()"><i class="fab fa-whatsapp"></i> '+t.ask+'</a></div></div></div>';
  }).join('');
}
function toggleMenu(){ document.getElementById('navLinks').classList.toggle('open'); }
function setLang(l){ lang=l; localStorage.setItem('tengmai_lang',l); applyLang(); render(document.querySelector('.cat-tab.active').dataset.filter); }
function applyLang(){
  var t=I18N[lang];
  document.querySelectorAll('[data-i18n]').forEach(function(el){ var k=el.getAttribute('data-i18n'); if(t[k]) el.innerHTML=t[k]; });
  document.documentElement.lang=lang;
  document.body.style.direction = (lang==='ar') ? 'rtl' : 'ltr';
  document.getElementById('btn-en').classList.toggle('active',lang==='en');
  document.getElementById('btn-zh').classList.toggle('active',lang==='zh');
  document.getElementById('btn-ar').classList.toggle('active',lang==='ar');
}
document.querySelectorAll('.cat-tab').forEach(function(btn){
  btn.addEventListener('click',function(){
    document.querySelectorAll('.cat-tab').forEach(function(b){b.classList.remove('active');});
    btn.classList.add('active');
    render(btn.dataset.filter);
  });
});
var h = (location.hash || '').replace('#','');
var initTab = h ? document.querySelector('.cat-tab[data-filter="' + h + '"]') : null;
if (initTab) { document.querySelectorAll('.cat-tab').forEach(function(b){ b.classList.remove('active'); }); initTab.classList.add('active'); }
applyLang();
render(initTab ? h : 'all');
</script>
</body>
